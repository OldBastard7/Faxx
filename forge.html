<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FAXX Forge</title><link rel="stylesheet" href="style.css" />
<style>
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:60vh}
@media(max-width:760px){.split{grid-template-columns:1fr}}
.pane{border:2px solid #f5e2ff;border-radius:14px;overflow:hidden;background:#fff}
.pane textarea{width:100%;height:100%;min-height:340px;border:0;border-radius:0;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.6;padding:14px;resize:none}
.pane iframe{width:100%;height:100%;min-height:340px;border:0;background:#fff}
</style></head>
<body>
<div class="top"><a class="brand" href="index.html">← FAXX</a><span class="spacer"></span>
<div class="nav"><a href="#" id="run">RUN ▶</a></div></div>
<div class="wrap"><h1>Forge</h1>
<div class="row" style="margin-bottom:12px"><button class="btn" id="run2">RUN</button>
<button class="btn ghost" id="clr">CLEAR</button>
<select id="ex"><option>blank</option><option value="1">sunset card</option><option value="2">counter</option></select></div>
<div class="split">
<textarea id="code" spellcheck="false"><!DOCTYPE html>
<h1 style="font-family:sans-serif">hello</h1></textarea>
<div class="pane"><iframe id="prev" sandbox="allow-scripts"></iframe></div>
</div></div>
<script>
const code = document.getElementById('code'), prev = document.getElementById('prev');
const run = () => prev.srcdoc = code.value;
document.getElementById('run').onclick = e => { e.preventDefault(); run(); };
document.getElementById('run2').onclick = run;
document.getElementById('clr').onclick = () => { code.value = ''; run(); };
const EX = {
  '1': `<!DOCTYPE html><style>body{margin:0;height:100vh;display:grid;place-items:center;font-family:sans-serif;background:linear-gradient(180deg,#ffd9ec,#ffe9c7,#d6f4ff)}h1{font-size:40px;color:#c2196a}</style><h1>sunset</h1>`,
  '2': `<!DOCTYPE html><style>body{font-family:sans-serif;text-align:center;padding:40px}</style><h2 id="n">0</h2><button onclick="n.textContent=+n.textContent+1">+1</button>`
};
document.getElementById('ex').onchange = e => { if(EX[e.target.value]){ code.value = EX[e.target.value]; run(); } };
run();
</script></body></html>
