<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FAXX Tunes</title><link rel="stylesheet" href="style.css" />
<style>.tr{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #f2e4fb}
.tr img{width:46px;height:46px;border-radius:9px;object-fit:cover}.tr b{font-size:12px;display:block}.tr span{font-size:10.5px;color:#8a6b9b}</style></head>
<body>
<div class="top"><a class="brand" href="index.html">← FAXX</a><span class="spacer"></span></div>
<div class="wrap">
  <h1>Tunes</h1>
  <p class="lead">Search any track. 30-second previews via Deezer — no key, no login, no cost.</p>
  <div class="row" style="margin-bottom:16px">
    <input id="q" placeholder="Artist or song…" style="flex:1;min-width:200px" />
    <button class="btn" id="go">SEARCH</button>
  </div>
  <div id="out"></div>
  <audio id="au" controls style="width:100%;margin-top:18px"></audio>
</div>
<script>
const PROXY = 'https://api.allorigins.win/raw?url=';
const out = document.getElementById('out'), au = document.getElementById('au');
async function search(){
  const q = document.getElementById('q').value.trim(); if(!q) return;
  out.innerHTML = '<p class="meta">Searching…</p>';
  try{
    const r = await fetch(PROXY + encodeURIComponent(`https://api.deezer.com/search?q=${encodeURIComponent(q)}&limit=30`));
    const j = await r.json();
    out.innerHTML = '';
    (j.data || []).forEach(t => {
      const d = document.createElement('div'); d.className = 'tr';
      d.innerHTML = `<img src="${t.album.cover_small}" alt=""><div><b>${t.title}</b><span>${t.artist.name}</span></div>`;
      d.onclick = () => { au.src = t.preview; au.play(); };
      out.appendChild(d);
    });
    if(!(j.data || []).length) out.innerHTML = '<p class="meta">Nothing found.</p>';
  } catch(e){ out.innerHTML = '<p class="meta">Proxy is busy — try again.</p>'; }
}
document.getElementById('go').onclick = search;
document.getElementById('q').onkeydown = e => { if(e.key === 'Enter') search(); };
</script></body></html>
