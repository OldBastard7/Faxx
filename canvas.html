<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FAXX Canvas</title><link rel="stylesheet" href="style.css" />
<style>#cv{width:100%;height:460px;border:3px solid var(--cyan);border-radius:14px;background:#fff;touch-action:none;cursor:crosshair}</style></head>
<body>
<div class="top"><a class="brand" href="index.html">← FAXX</a><span class="spacer"></span></div>
<div class="wrap"><h1>Canvas</h1>
<div class="row" style="margin-bottom:12px">
<input type="color" id="col" value="#ff2e88" style="width:52px;height:40px;padding:3px">
<input type="range" id="sz" min="1" max="60" value="6">
<button class="btn ghost" id="er">ERASE</button><button class="btn" id="clr">CLEAR</button>
<button class="btn cy" id="save">SAVE PNG</button></div>
<canvas id="cv"></canvas></div>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
function size(){ const r = cv.getBoundingClientRect(); cv.width = r.width; cv.height = r.height;
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,cv.width,cv.height); }
size(); addEventListener('resize', size);
let down = false, erase = false;
const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
cv.onpointerdown = e => { down = true; const [x,y] = pos(e); ctx.beginPath(); ctx.moveTo(x,y); };
cv.onpointermove = e => { if(!down) return; const [x,y] = pos(e);
  ctx.lineCap = ctx.lineJoin = 'round';
  ctx.strokeStyle = erase ? '#fff' : document.getElementById('col').value;
  ctx.lineWidth = document.getElementById('sz').value;
  ctx.lineTo(x,y); ctx.stroke(); };
addEventListener('pointerup', () => down = false);
document.getElementById('er').onclick = () => erase = !erase;
document.getElementById('clr').onclick = () => { ctx.fillStyle = '#fff'; ctx.fillRect(0,0,cv.width,cv.height); };
document.getElementById('save').onclick = () => { const a = document.createElement('a');
  a.download = 'faxx-canvas.png'; a.href = cv.toDataURL(); a.click(); };
</script></body></html>
